<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Art</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#fff;
    color:#222;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

/* NAV */

.project-nav{
    position:fixed;
    top:30px;
    left:30px;
    z-index:1000;
    display:flex;
    align-items:center;
    gap:4px;
    height:55px;
    padding:8px;
    background:rgba(0,0,0,.14);
    border-radius:999px;
    overflow:hidden;
    backdrop-filter:blur(10px);
}

.project-nav a{
    position:relative;
    z-index:2;
    text-decoration:none;
    color:#111;
    font-size:.8rem;
    line-height:1;
    padding:12px 18px;
    border-radius:999px;
    transition:color .3s ease;
}

.project-nav a.active{
    background:none;
}

.nav-bubble{
    position:absolute;
    top:4px;
    left:0;
    z-index:1;
    height:calc(100% - 8px);
    background:rgba(255,255,255,.45);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border-radius:999px;
    border:1px solid rgba(255,255,255,.65);
    box-shadow:
        0 2px 6px rgba(0,0,0,.08),
        0 10px 20px rgba(255,255,255,.15),
        inset 0 1px 1px rgba(255,255,255,.95);
    opacity:1;
    transition:
        left .55s cubic-bezier(.34,1.56,.64,1),
        width .55s cubic-bezier(.34,1.56,.64,1),
        transform .25s ease,
        opacity .3s ease,
        filter .3s ease;
}

.nav-bubble::before{
    content:"";
    position:absolute;
    top:2px;
    left:8px;
    width:70%;
    height:45%;
    border-radius:999px;
    background:
    linear-gradient(
        to bottom,
        rgba(255,255,255,.75),
        rgba(255,255,255,0)
    );
}

/* PAGE */

.container{
    max-width:1200px;
    width:100%;
    margin:0 auto;
    padding:0 60px;
    padding-top:120px;
    padding-bottom:120px;
}

.description{
    max-width:600px;
    margin:0 auto 80px auto;
    padding-top:100px;
    text-align:center;
    color:#777;
    font-size:.9rem;
    line-height:1.5;
}


.gallery{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
    max-width:1100px;
    margin:0 auto 300px auto;
}


.work{
    margin:0;
}

.jude{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.jude figcaption{
    margin-left:-210px;
}

.work img{
    width:100%;
    height:380px;
    object-fit:contain;
    display:block;
}

/* Add this */
.sculpture{
    margin-top:60px;
}

.sculpture model-viewer{
    width:100%;
    height:380px;
    background:radial-gradient(
        ellipse at center,
        #d6d6d6 0%,
        #c9c9c9 55%,
        #b7b7b7 100%
    );
    border-radius:4px;
}
  

.work-wide{
    grid-column:1 / -1;
    max-width:650px;
    justify-self:center;
    margin-top:40px;
}

figcaption{
    margin-top:30px;
}

.title{
    display:block;
    font-size:1rem;
    font-weight:500;
    color:#222;
    margin-bottom:2px;
}

.medium{
    display:block;
    font-size:.78rem;
    color:#999;
}

@media(max-width:900px){

    .gallery{
        grid-template-columns:1fr;
        gap:40px;
    }

    .work-wide{
        grid-column:auto;
        max-width:none;
    }

}

    .project-nav{
        left:15px;
        top:15px;
    }

/* FOOTER */

.footer{
  text-align:center;
  padding:300px 40px 120px 40px;
  opacity:.4;
  font-size:.9rem;
  color:#333 !important;
}

</style>
</head>

<body>

<nav class="project-nav">

    <span class="nav-bubble"></span>

    <a href="/index.html">Home</a>
    <a href="/Comh.html">Exhibition</a>
    <a href="/ARGlasses.html">Product</a>
    <a href="/Commercial.html">Commercial</a>
    <a href="/Archive.html">Archive</a>
    <a href="/Art.html" class="active">Art</a>

</nav>

<p class="description">
    Selected works spanning painting and printmaking.
</p>

<div class="gallery">

    <figure class="work">
        <img src="./dissonance.jpg" alt="Dissonance">
        <figcaption>
            <span class="title">Dissonance</span>
            <span class="medium">Oil on canvas</span>
        </figcaption>
    </figure>

    <figure class="work jude">
    <img src="./jude.jpg" alt="Jude">
    <figcaption>
        <span class="title">Jude</span>
        <span class="medium">Oil on canvas</span>
    </figcaption>
</figure>


    <div class="bottom-row">

    <div class="bottom-row">

    <figure class="work">
        <img src="./dividends.jpg" alt="Dividends">

        <figcaption>
            <span class="title">Dividends</span>
            <span class="medium">Monoprint on paper</span>
        </figcaption>
    </figure>

    <figure class="work sculpture">

        <model-viewer
            src="./horse-teeth.glb"
            camera-controls
            auto-rotate
            shadow-intensity="2"
            exposure="0.8">
        </model-viewer>

        <figcaption>
            <span class="title">Straight From The Horses Mouth</span>
            <span class="medium">3D printed sculpture</span>
        </figcaption>

    </figure>

</div>

</div>

<script>

/* NAVIGATION BUBBLE */

function moveBubble(){

    const active =
    document.querySelector(".project-nav a.active");

    const bubble =
    document.querySelector(".nav-bubble");

    bubble.style.width =
    (active.offsetWidth + 24) + "px";

    bubble.style.left =
    (active.offsetLeft - 12) + "px";
}

window.addEventListener("load",()=>{

    const bubble =
    document.querySelector(".nav-bubble");

    bubble.style.transition = "none";

    moveBubble();

    requestAnimationFrame(()=>{

        bubble.style.transition =
        `left .55s cubic-bezier(.34,1.56,.64,1),
         width .55s cubic-bezier(.34,1.56,.64,1),
         transform .25s ease,
         opacity .3s ease,
         filter .3s ease`;

    });

    document
    .querySelectorAll(".project-nav a")
    .forEach(link=>{

        link.addEventListener("click",e=>{

            e.preventDefault();

            bubble.style.opacity=".75";
            bubble.style.filter="blur(3px)";
            bubble.style.transform="scale(1.03)";

            const targetWidth =
            link.offsetWidth + 24;

            bubble.style.width =
            (targetWidth + 20) + "px";

            bubble.style.left =
            (link.offsetLeft - 12) + "px";

            setTimeout(()=>{

                bubble.style.width =
                targetWidth + "px";

                bubble.style.opacity="1";
                bubble.style.filter="blur(0px)";
                bubble.style.transform="scale(1)";

            },300);

            setTimeout(()=>{

                window.location.href =
                link.href;

            },650);

        });

    });

});
</script>

</body>
</html>
